<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <title>系統管理員後台 - 客戶持倉總控</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
    .container { max-width: 1280px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .search-bar-box { background: #fff; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 24px; display: flex; gap: 12px; align-items: center; }
    .search-input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; margin: 0; }
    .search-input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    th { background: #f9fafb; font-weight: 600; color: #4b5563; }
    .btn { cursor: pointer; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; transition: .2s; }
    .btn-primary { background: #10b981; color: #fff; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: #fff; padding: 30px; border-radius: 16px; width: 360px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    input[type="password"] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 6px; margin-bottom: 16px; box-sizing: border-box; }
    .tag { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #dbeafe; color: #1e40af; font-weight: 600; }
    .detail-section { background: #f9fafb; padding: 16px; border-radius: 8px; margin-top: 12px; display: none; }
    .client-group { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin-top: 12px; }
    .client-title { font-weight: 700; color: #111827; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .pnl-pos { color: #dc2626; font-weight: 600; }
    .pnl-neg { color: #16a34a; font-weight: 600; }
    .pnl-zero { color: #4b5563; }
    .stock-link { text-decoration: none; color: #2563eb; font-weight: 600; }
    .stock-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- 管理員登入彈窗 -->
<div id="loginModal" class="modal-overlay">
  <div class="login-box">
    <h2 style="margin-top:0;text-align:center;">🛡️ 管理員後台登入</h2>
    <form onsubmit="handleAdminLogin(event)">
      <label style="font-size:13px;color:#4b5563;">管理員金鑰 / 密碼</label>
      <input type="password" id="adminPwdInput" placeholder="請輸入管理員密碼" required />
      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">驗證登入</button>
    </form>
  </div>
</div>

<div class="container">
  <div class="header">
    <div>
      <h2 style="margin:0;">📊 全系統數據總控後台</h2>
      <span id="userCount" style="font-size:14px;color:#6b7280;">請先完成管理員驗證</span>
    </div>
    <div>
      <button class="btn btn-secondary" onclick="loadAdminData()">🔄 重新整理 / 更新股價</button>
      <button class="btn btn-primary" onclick="exportAllCSV()">📥 匯出全系統 CSV</button>
    </div>
  </div>

  <!-- 全局關鍵字與股票搜索框 -->
  <div class="search-bar-box">
    <span style="font-weight:600;color:#374151;">🔍 快速搜尋：</span>
    <input type="text" id="searchInput" class="search-input" placeholder="輸入股票名稱、代碼 (如 2330)、客戶姓名、或帳號 ID..." oninput="filterData()" />
  </div>

  <div id="usersList"></div>
</div>

<script>
  const API_URL = "https://003-v2.onrender.com/api";
  let currentAdminPwd = "";
  let globalUsersData = [];
  let priceMap = {};

  function fmtMoney(num) {
    if (num === null || num === undefined || isNaN(num)) return "-";
    return Number(num).toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  async function handleAdminLogin(e) {
    e.preventDefault();
    const pwd = document.getElementById("adminPwdInput").value.trim();
    if (!pwd) return;

    currentAdminPwd = pwd;
    const success = await loadAdminData();
    if (success) {
      document.getElementById("loginModal").style.display = "none";
    }
  }

  async function fetchRealTimePrices(codes) {
    if (!codes || codes.length === 0) return;
    try {
      const res = await fetch(`${API_URL}/prices`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codes: codes })
      });
      const data = await res.json();
      if (data.success && data.prices) {
        priceMap = data.prices;
      }
    } catch (e) {
      console.warn("無法抓取最新股價:", e);
    }
  }

  async function loadAdminData() {
    try {
      const res = await fetch(`${API_URL}/admin/all_data`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPassword: currentAdminPwd })
      });

      const data = await res.json();
      if (!res.ok || !data.success) {
        alert(data.message || "管理員密碼錯誤！");
        return false;
      }

      globalUsersData = data.users;

      const allCodes = new Set();
      globalUsersData.forEach(u => {
        (u.holdings || []).forEach(h => {
          if (h.code) allCodes.add(String(h.code).trim());
        });
      });

      if (allCodes.size > 0) {
        document.getElementById("userCount").innerText = `當前系統共 ${data.totalUsers} 位用戶，正在更新實時股價...`;
        await fetchRealTimePrices(Array.from(allCodes));
      }

      document.getElementById("userCount").innerText = `當前系統共有 ${data.totalUsers} 位用戶註冊/使用中 (實時股價已更新)`;
      renderUsers(globalUsersData);
      return true;
    } catch (err) {
      alert("連線失敗，請檢查 Render 後端服務狀態");
      return false;
    }
  }

  function filterData() {
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
    if (!keyword) {
      renderUsers(globalUsersData);
      return;
    }

    const filtered = globalUsersData.map(user => {
      const userMatch = user.userId.toLowerCase().includes(keyword);
      const filteredHoldings = (user.holdings || []).filter(h => 
        (h.client && h.client.toLowerCase().includes(keyword)) ||
        (h.stockName && h.stockName.toLowerCase().includes(keyword)) ||
        (h.code && String(h.code).toLowerCase().includes(keyword))
      );

      if (userMatch || filteredHoldings.length > 0) {
        return {
          ...user,
          holdings: userMatch ? user.holdings : filteredHoldings
        };
      }
      return null;
    }).filter(Boolean);

    renderUsers(filtered, true);
  }

  function renderUsers(users, isSearching = false) {
    const container = document.getElementById("usersList");
    if (!users || users.length === 0) {
      container.innerHTML = `<div class="card" style="text-align:center;color:#9ca3af;">未找到符合條件的持倉或客戶資料</div>`;
      return;
    }

    container.innerHTML = "";
    users.forEach((user, index) => {
      const card = document.createElement("div");
      card.className = "card";

      // 依據「客戶名稱」對持倉進行歸類分組
      const groupedHoldings = {};
      (user.holdings || []).forEach(h => {
        const clientName = h.client || '未分類客戶';
        if (!groupedHoldings[clientName]) {
          groupedHoldings[clientName] = [];
        }
        groupedHoldings[clientName].push(h);
      });

      let clientGroupsHTML = "";
      Object.keys(groupedHoldings).forEach(clientName => {
        const clientHoldings = groupedHoldings[clientName];
        const profile = (user.profiles && user.profiles[clientName]) || {};

        let profileBadge = "";
        if (profile.gender || profile.age || profile.experience || profile.style || profile.note) {
          profileBadge = `<span style="font-size:12px;font-weight:normal;color:#6b7280;margin-left:8px;">
            (${profile.gender || '性別未填'} | ${profile.age ? profile.age+'歲' : '年齡未填'} | 股齡:${profile.experience || '未填'} | 風格:${profile.style || '未填'})
          </span>`;
        }

        let tableRows = "";
        clientHoldings.forEach(h => {
          const curPrice = priceMap[h.code] || h.cost || 0;
          const qty = Number(h.quantity) || 0;
          const cost = Number(h.cost) || 0;
          const totalValue = curPrice * qty;
          const pnl = (curPrice - cost) * qty;
          const pnlRate = cost > 0 ? ((curPrice - cost) / cost) * 100 : 0;

          let pnlClass = "pnl-zero";
          if (pnl > 0) pnlClass = "pnl-pos";
          else if (pnl < 0) pnlClass = "pnl-neg";

          tableRows += `
            <tr>
              <td>
                <a href="https://statementdog.com/analysis/${h.code}" target="_blank" class="stock-link">
                  ${h.stockName} (${h.code})
                </a>
              </td>
              <td>${fmtMoney(qty)} 股</td>
              <td>NT$ ${fmtMoney(cost)}</td>
              <td style="font-weight:600;color:#2563eb;">NT$ ${fmtMoney(curPrice)}</td>
              <td>NT$ ${fmtMoney(totalValue)}</td>
              <td class="${pnlClass}">NT$ ${fmtMoney(pnl)} (${pnlRate >= 0 ? '+' : ''}${pnlRate.toFixed(2)}%)</td>
              <td style="font-size:12px;color:#9ca3af;">${h.stopLoss || '-'} / ${h.takeProfit || '-'}</td>
            </tr>
          `;
        });

        clientGroupsHTML += `
          <div class="client-group">
            <div class="client-title">
              <span>👤 客戶：${clientName}</span>
              ${profileBadge}
            </div>
            <table>
              <thead>
                <tr>
                  <th>股票名稱 (代碼)</th>
                  <th>持股數量</th>
                  <th>買入成本</th>
                  <th>當前現價</th>
                  <th>即時市值</th>
                  <th>預估盈虧</th>
                  <th>止損 / 止盈</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        `;
      });

      const displayStyle = isSearching ? 'block' : 'none';

      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h3 style="margin:0;display:inline-block;">👤 帳號自訂ID: ${user.userId}</h3>
            <span class="tag" style="margin-left:8px;">密碼: ${user.password || '無'}</span>
            <span class="tag" style="background:#fef3c7;color:#92400e;margin-left:4px;">顯示筆數: ${user.holdings.length}</span>
          </div>
          <button class="btn btn-secondary" onclick="toggleDetail('detail-${index}')">查看詳細內容</button>
        </div>

        <div id="detail-${index}" class="detail-section" style="display: ${displayStyle}">
          ${clientGroupsHTML || '<div style="font-size:13px;color:#9ca3af;margin-top:8px;">無持倉資料</div>'}
        </div>
      `;

      container.appendChild(card);
    });
  }

  function toggleDetail(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
  }

  function exportAllCSV() {
    if (!globalUsersData.length) return alert("無資料可導出");
    let csv = "用戶帳號,客戶姓名,股票名稱,股票代碼,數量,成本價,當前現價,預估盈虧,止損價,止盈價\n";
    globalUsersData.forEach(user => {
      user.holdings.forEach(h => {
        const curPrice = priceMap[h.code] || h.cost || 0;
        const pnl = (curPrice - h.cost) * h.quantity;
        csv += `${user.userId},${h.client||''},${h.stockName},${h.code},${h.quantity},${h.cost},${curPrice},${pnl},${h.stopLoss||''},${h.takeProfit||''}\n`;
      });
    });
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "全系統客戶持倉總表.csv";
    a.click();
  }
</script>
</body>
</html>
